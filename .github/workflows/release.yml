name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v, e.g. 0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Decode keystore
        run: echo "${{ secrets.VTEXT_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/vtext.keystore"

      - name: Build signed APK
        env:
          VTEXT_KEYSTORE_PATH: ${{ runner.temp }}/vtext.keystore
          VTEXT_KEYSTORE_PASSWORD: ${{ secrets.VTEXT_KEYSTORE_PASSWORD }}
          VTEXT_KEY_ALIAS: ${{ secrets.VTEXT_KEY_ALIAS }}
          VTEXT_KEY_PASSWORD: ${{ secrets.VTEXT_KEY_PASSWORD }}
          VTEXT_VERSION_NAME: ${{ env.VERSION }}
          VTEXT_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk "vtext-$VERSION.apk"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "vtext-$VERSION.apk" | head -5

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "vtext-$VERSION.apk" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtext-release-apk
          path: vtext-${{ env.VERSION }}.apk
          retention-days: 14
